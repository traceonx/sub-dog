name: sub-dog
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    container_name: sub-dog
    environment:
      TZ: Asia/Shanghai
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      APP_PASSWORD: ${APP_PASSWORD:-}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/app/data/subtitles}
      MEDIA_DIR: ${MEDIA_DIR:-}
    volumes:
      - appdata:/app/data
      - ${MEDIA_ROOT:-./media-root}:/media-root
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8082}:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
volumes:
  appdata:
