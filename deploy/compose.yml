name: sub-dog
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  app:
    image: ${APP_IMAGE:-sub-dog:local}
    logging: *logging
    stop_grace_period: 30s
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      TZ: Asia/Shanghai
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - appdata:/app/data
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8082}:8080"
    restart: unless-stopped
volumes:
  appdata:
