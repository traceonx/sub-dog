<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Sub-Dog · 字幕工作台</title>
<link rel="stylesheet" href="/static/style.css">
<script defer src="/static/app.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-sub" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 15h4M14 15h3M7 11.5h2M12 11.5h5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
</svg>

<div class="layout">
  <nav class="drawer" aria-label="主导航">
    <a class="brand" href="/" aria-label="Sub-Dog 首页">
      <span class="logo" aria-hidden="true"><svg class="icon"><use href="#i-sub"/></svg></span>
      <span class="brand-text"><b>Sub-Dog</b><small>字幕工作台</small></span>
    </a>
    <div class="nav-caption">字幕</div>
    <button class="nav-item active" type="button" data-view="search"><svg class="icon"><use href="#i-search"/></svg><span>字幕搜索</span></button>
    <button class="nav-item" type="button" data-view="tasks"><svg class="icon"><use href="#i-tasks"/></svg><span>任务队列</span><em id="nav-task-badge" class="nav-badge" hidden></em></button>
    <button class="nav-item" type="button" data-view="files"><svg class="icon"><use href="#i-folder"/></svg><span>已下载</span><em id="nav-file-badge" class="nav-badge muted-badge" hidden></em></button>
    <div class="drawer-foot">
      <span id="connection" class="conn">正在连接…</span>
      <small>字幕库 · SubHD · 伪射手</small>
    </div>
  </nav>

  <div class="main">
    <header class="appbar">
      <h1 id="page-title">字幕搜索</h1>
      <div class="appbar-tools">
        <button id="captcha-alert" class="pill-alert" type="button" hidden><svg class="icon"><use href="#i-key"/></svg>有验证码待输入</button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深浅色"><svg class="icon"><use href="#i-moon"/></svg></button>
      </div>
    </header>

    <!-- ============ 搜索 ============ -->
    <section class="view" id="view-search" aria-labelledby="page-title">
      <form id="search-form" class="card search-card">
        <div class="search-hero">
          <div>
            <h2>想看点什么？</h2>
            <p>一次搜索三个字幕站，结果合并展示。</p>
          </div>
        </div>
        <div class="search-field">
          <svg class="icon"><use href="#i-search"/></svg>
          <label class="sr-only" for="keyword">电影或剧集名称</label>
          <input id="keyword" name="keyword" placeholder="电影、剧集名称或发行版本" required maxlength="150" autocomplete="off">
          <button id="search-button" type="submit" class="btn btn-primary">搜索</button>
        </div>
        <div class="filters">
          <fieldset class="chips"><legend>来源</legend>
            <label class="chip"><input type="checkbox" name="sources" value="zimuku" checked><span>字幕库</span></label>
            <label class="chip"><input type="checkbox" name="sources" value="subhd" checked><span>SubHD</span></label>
            <label class="chip"><input type="checkbox" name="sources" value="assrt" checked><span>伪射手</span></label>
          </fieldset>
          <fieldset class="chips"><legend>格式</legend>
            <label class="chip"><input type="radio" name="fmt" value="" checked><span>全部</span></label>
            <label class="chip"><input type="radio" name="fmt" value="SRT"><span>SRT</span></label>
            <label class="chip"><input type="radio" name="fmt" value="ASS"><span>ASS</span></label>
            <label class="chip"><input type="radio" name="fmt" value="SSA"><span>SSA</span></label>
            <label class="chip"><input type="radio" name="fmt" value="SUP"><span>SUP</span></label>
            <label class="chip"><input type="radio" name="fmt" value="VTT"><span>VTT</span></label>
          </fieldset>
          <fieldset class="chips"><legend>语言</legend>
            <label class="chip"><input type="radio" name="language" value="" checked><span>全部</span></label>
            <label class="chip"><input type="radio" name="language" value="简体"><span>简体</span></label>
            <label class="chip"><input type="radio" name="language" value="繁体"><span>繁体</span></label>
            <label class="chip"><input type="radio" name="language" value="双语"><span>双语</span></label>
            <label class="chip"><input type="radio" name="language" value="英文"><span>英文</span></label>
          </fieldset>
          <div class="filter-tail">
            <label class="limit">最多 <input type="number" id="limit" value="40" min="1" max="100" required> 条</label>
            <label class="switch"><input type="checkbox" id="use-ocr" checked><span class="track" aria-hidden="true"></span>自动识别验证码</label>
          </div>
        </div>
      </form>

      <div class="toolbar">
        <h2>搜索结果 <span id="result-count" class="count">0</span></h2>
        <div class="toolbar-tools">
          <label class="sr-only" for="result-filter">在结果中筛选</label>
          <input id="result-filter" class="field-sm" type="search" placeholder="在结果中筛选…" autocomplete="off">
          <select id="search-history" class="field-sm" aria-label="切换搜索任务"><option value="">暂无搜索</option></select>
        </div>
      </div>
      <div id="source-errors"></div>
      <div id="results" class="grid empty">
        <div class="empty-state">
          <span class="empty-icon" aria-hidden="true"><svg class="icon"><use href="#i-sub"/></svg></span>
          <h3>从一部喜欢的电影开始</h3>
          <p>输入片名搜索，三个来源的结果会合并在这里。</p>
        </div>
      </div>
    </section>

    <!-- ============ 任务 ============ -->
    <section class="view" id="view-tasks" hidden>
      <div class="toolbar"><span id="task-summary" class="muted"></span></div>
      <div id="tasks" class="task-list"></div>
    </section>

    <!-- ============ 文件 ============ -->
    <section class="view" id="view-files" hidden>
      <div class="toolbar">
        <span class="muted">共 <b id="file-count">0</b> 个文件 · 点击文件名下载到本机</span>
        <button class="btn btn-tonal btn-sm" id="refresh-files" type="button"><svg class="icon"><use href="#i-refresh"/></svg>刷新</button>
      </div>
      <div id="files" class="card table-card"></div>
    </section>

    <footer class="foot">Sub-Dog · 本地部署 · Cookie 与文件保存在挂载目录</footer>
  </div>
</div>

<div id="notice" class="snackbar" role="status" hidden></div>

<dialog id="captcha-dialog" aria-labelledby="captcha-title">
  <div class="dialog-head"><h2 id="captcha-title">需要验证</h2><span id="captcha-timer" class="timer"></span></div>
  <div id="captcha-body" class="dialog-body"></div>
</dialog>

<dialog id="detail-dialog">
  <div class="dialog-head">
    <h2>字幕详情</h2>
    <button class="btn btn-text btn-sm" id="close-detail" type="button">关闭 ×</button>
  </div>
  <article id="detail-content" class="dialog-body"></article>
</dialog>
</body>
</html>
